<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#2c5b5d;--coral:#e2725b;--cream:#fbf4e8;--ink:#1f2e2f}
body{margin:0}
.b{position:relative;width:2000px;height:2000px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#fbf4e8 0%,#f1e4cf 75%);font-family:Inter,sans-serif}
.phone{position:absolute;background:#111;border-radius:64px;padding:16px;box-shadow:0 40px 80px rgba(0,0,0,.35),inset 0 0 0 2px #333;width:600px;height:1220px}
.phone::before{content:"";position:absolute;top:28px;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#111;border-radius:20px}
.phone img{display:block;width:100%;height:100%;object-fit:contain;background:#2c5b5d;border-radius:50px}
.p1{left:330px;top:420px;transform:rotate(-6deg)}
.p2{left:1060px;top:420px;transform:rotate(6deg)}
.sheet{position:absolute;width:430px;height:608px;box-shadow:0 24px 50px rgba(0,0,0,.22);border-radius:4px}
.s1{left:140px;top:1250px;transform:rotate(-12deg)}
.s2{left:785px;top:1330px;z-index:3}
.s3{left:1430px;top:1250px;transform:rotate(12deg)}
.title{position:absolute;left:0;right:0;top:110px;text-align:center;font-family:Lora,serif;font-weight:700;font-size:96px;color:var(--teal)}
.sub{position:absolute;left:0;right:0;top:240px;text-align:center;font-size:40px;letter-spacing:.2em;text-transform:uppercase;color:var(--coral);font-weight:600}
.tag{position:absolute;right:120px;top:330px;background:var(--coral);color:#fff;font-weight:600;font-size:46px;padding:22px 40px;border-radius:999px;box-shadow:0 14px 30px rgba(0,0,0,.18);transform:rotate(4deg);z-index:4}
</style></head><body>
<div class="b" id="b">
  <div class="title">The Juno Vale Bundle</div>
  <div class="sub">2 books · 3 printable bonuses</div>
  <div class="phone p1"><img src="../src/p1-01.png"></div>
  <div class="phone p2"><img src="../two-hours-later/src/thl1-01.png"></div>
  <img class="sheet s1" src="../two-hours-later/src/map-1.png">
  <img class="sheet s2" src="../two-hours-later/src/pushback-1.png">
  <img class="sheet s3" src="../two-hours-later/src/repair-1.png">
</div></body></html>
