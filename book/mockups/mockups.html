<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,400&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#777}
.b{position:relative;overflow:hidden;margin-bottom:30px}
/* 3D book */
.book{position:absolute;transform-style:preserve-3d}
.book .f,.book .s,.book .pg{position:absolute;top:0;left:0;backface-visibility:hidden}
.book .f{width:100%;height:100%;background-size:cover;border-radius:0 4px 4px 0;box-shadow:inset 6px 0 10px -6px rgba(0,0,0,.45)}
.book .f::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.18) 0,rgba(255,255,255,0) 3%,rgba(0,0,0,.12) 4%,rgba(255,255,255,0) 7%);border-radius:inherit}
.book .s{height:100%;background-size:100% 100%;transform-origin:left center;transform:rotateY(-90deg)}
.book .pg{height:calc(100% - 8px);top:4px;transform-origin:right center;background:repeating-linear-gradient(90deg,#f7f3ea 0,#f7f3ea 2px,#e6dfd1 3px)}
/* 1 hero standing */
#m1{width:2000px;height:2000px;background:radial-gradient(ellipse at 50% 35%,#f6efe3 0%,#e7dccb 60%,#d8c9b2 100%)}
#m1 .floor{position:absolute;left:0;right:0;bottom:0;height:640px;background:linear-gradient(#cdbb9f,#c1ad8f)}
#m1 .stage{position:absolute;left:0;top:0;width:2000px;height:2000px;perspective:3200px}
#m1 .book{width:820px;height:1268px;left:620px;top:300px;transform:rotateY(28deg) rotateX(2deg)}
#m1 .book .s{width:44px;left:0}
#m1 .shadow{position:absolute;left:560px;top:1520px;width:1000px;height:110px;background:radial-gradient(ellipse at center,rgba(60,40,20,.45),rgba(60,40,20,0) 70%);filter:blur(8px)}
#m1 .twig{position:absolute;font-family:Lora,serif;left:120px;top:140px;color:#5b4a35;font-size:44px;letter-spacing:.3em;text-transform:uppercase}
/* 2 front & back flat */
#m2{width:2000px;height:2000px;background:linear-gradient(135deg,#efe6d6,#dccbb0)}
#m2 img{position:absolute;width:780px;height:1205px;box-shadow:0 40px 70px rgba(50,35,20,.35),0 6px 12px rgba(0,0,0,.15);border-radius:2px 6px 6px 2px}
#m2 .back{left:190px;top:420px;transform:rotate(-4deg)}
#m2 .front{left:1020px;top:380px;transform:rotate(3deg)}
#m2 .lbl{position:absolute;left:0;right:0;top:150px;text-align:center;font-family:Lora,serif;font-size:72px;color:#3b3127}
#m2 .lbl small{display:block;font-family:Inter,sans-serif;font-size:30px;letter-spacing:.25em;text-transform:uppercase;color:#a8701f;margin-top:18px}
/* 3 open book */
#m3{width:2000px;height:1500px;background:linear-gradient(160deg,#3a3936,#2b2a28 60%,#4a3b25)}
#m3 .open{position:absolute;left:220px;top:250px;width:1560px;height:1010px;display:flex;filter:drop-shadow(0 40px 50px rgba(0,0,0,.5))}
#m3 .open img{width:780px;height:1010px;display:block}
#m3 .open .l{border-radius:8px 0 0 8px}
#m3 .open .r{border-radius:0 8px 8px 0}
#m3 .gut{position:absolute;left:700px;top:0;width:160px;height:100%;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.18) 45%,rgba(0,0,0,.28) 50%,rgba(0,0,0,.18) 55%,rgba(0,0,0,0))}
#m3 .curvel{position:absolute;left:0;top:0;width:780px;height:100%;background:linear-gradient(90deg,rgba(0,0,0,.08),rgba(255,255,255,0) 20%,rgba(255,255,255,0) 80%,rgba(0,0,0,.05))}
#m3 .cap{position:absolute;left:0;right:0;top:80px;text-align:center;font-family:Lora,serif;font-style:italic;font-size:54px;color:#e8c27a}
/* 4 instagram 1080x1350 */
#m4{width:1080px;height:1350px;background:radial-gradient(ellipse at 50% 40%,#f6efe3,#dfd1bb)}
#m4 .stage{position:absolute;inset:0;perspective:2000px}
#m4 .book{width:520px;height:804px;left:300px;top:260px;transform:rotateY(-26deg)}
#m4 .book .s{width:30px;left:0}
#m4 .book .pg{width:26px;left:auto;right:0;transform:rotateY(90deg);transform-origin:right center}
#m4 .shadow{position:absolute;left:260px;top:1020px;width:640px;height:80px;background:radial-gradient(ellipse at center,rgba(60,40,20,.45),rgba(60,40,20,0) 70%);filter:blur(6px)}
#m4 .t{position:absolute;left:0;right:0;top:110px;text-align:center;font-family:Lora,serif;font-size:50px;color:#3b3127}
#m4 .t small{display:block;font-family:Inter,sans-serif;font-size:22px;letter-spacing:.25em;text-transform:uppercase;color:#a8701f;margin-top:12px}
#m4 .bottom{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-family:Inter,sans-serif;font-size:26px;color:#5b4a35;letter-spacing:.06em}
</style></head><body>

<div class="b" id="m1"><div class="floor"></div><div class="shadow"></div>
 <div class="stage"><div class="book"><div class="s" style="background-image:url(spine.png)"></div><div class="f" style="background-image:url(front.png)"></div></div></div>
</div>

<div class="b" id="m2"><div class="lbl">Cisza, z której pochodzę<small>Książka papierowa · miękka i twarda oprawa</small></div>
 <img class="back" src="back.png"><img class="front" src="front.png">
</div>

<div class="b" id="m3"><div class="cap">„Każda opowieść o uzdrowieniu zaczyna się od miejsca, które bolało.”</div>
 <div class="open"><img class="l" src="int-006.png"><img class="r" src="int-007.png"><div class="curvel"></div><div class="gut"></div></div>
</div>

<div class="b" id="m4"><div class="t">Teraz w wersji papierowej<small>Joanna Dorobisz</small></div><div class="shadow"></div>
 <div class="stage"><div class="book"><div class="pg"></div><div class="f" style="background-image:url(front.png)"></div></div></div>
 <div class="bottom">letyoursoulglow.store</div>
</div>
</body></html>
